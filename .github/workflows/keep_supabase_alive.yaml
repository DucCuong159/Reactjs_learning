name: Keep Supabase Alive

on:
  schedule:
    # Chạy vào 00:00 UTC mỗi 3 ngày một lần (Supabase tự pause sau 7 ngày không hoạt động)
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Cho phép bấm chạy thủ công kiểm tra từ tab Actions trên GitHub

jobs:
  ping-supabase:
    name: Ping Supabase API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send keep-alive ping to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret in GitHub Repository Secrets!"
            exit 1
          fi

          # Loại bỏ dấu / ở cuối URL nếu có
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Pinging: $CLEAN_URL/rest/v1/"
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$CLEAN_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Ping thanh cong! Supabase database da duoc danh thuc va dang hoat dong."
          else
            echo "::error::Ping Supabase that bai voi HTTP status $HTTP_STATUS! Response: $HTTP_BODY"
            exit 1
          fi
